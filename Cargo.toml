[workspace]
members = [".", "demo/wasm"]

[package]
name = "clipper2-rust"
version = "1.3.0"
edition = "2021"
rust-version = "1.77"
authors = ["Lars Brubaker <larsbrubaker@matterhackers.com>"]
description = "Pure Rust port of the Clipper2 polygon clipping and offsetting library"
license = "BSL-1.0"
repository = "https://github.com/larsbrubaker/clipper2-rust"
homepage = "https://larsbrubaker.github.io/clipper2-rust/"
documentation = "https://docs.rs/clipper2-rust/"
readme = "README.md"
keywords = ["polygon", "clipping", "geometry", "offsetting", "2d"]
categories = ["algorithms", "graphics", "mathematics"]
exclude = ["demo/", "docs/", "tests/", ".github/", ".claude/", "benches/", "scripts/", "CLAUDE.md", "nul"]

[features]
default = []

# Mirrors the C++ USINGZ ifdef: adds a z field to Point<T> and z-callback
# support on Clipper64/ClipperD.
using_z = []

# Conversions to and from the geo-types primitives used by the geo crate.
geo = ["dep:geo-types"]

[lib]
name = "clipper2_rust"
path = "src/lib.rs"

[dependencies]
# Core dependencies for mathematical operations
num-traits = "0.2"
geo-types = { version = "0.7", optional = true }

[dev-dependencies]
# Testing framework
criterion = "0.5"
rand = "0.8"

[[bench]]
name = "clipper_bench"
harness = false

# The using_z example calls z-only APIs, so it must not compile in default builds.
[[test]]
name = "test_geo"
required-features = ["geo"]

[[example]]
name = "using_z"
required-features = ["using_z"]
